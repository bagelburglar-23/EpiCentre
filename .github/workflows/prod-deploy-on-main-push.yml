name: prod-deploy-on-main-push

on:
  push:
    branches: ["main"]

concurrency:
  group: epicentre-deploy
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy main to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: claude
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            cd /home/claude/epicentre
            git fetch origin main
            git reset --hard origin/main
            export DEPLOY_ENV=production
            export DATABASE_PATH=/home/claude/shared/epicentre.db
            export NEXT_PUBLIC_COMMIT_SHA=$(git rev-parse HEAD)
            npm ci
            npm run build
            node scripts/record-deploy.mjs production "$NEXT_PUBLIC_COMMIT_SHA"
            systemctl --user restart epicentre
            # UAT reads deploy_state live, per request (see lib/db.ts /
            # connection()) - its accent reflects this the moment the row
            # above is written, no restart of epicentre-preview needed.
