name: prod-deploy-on-main-push

on:
  push:
    branches: ["main"]

concurrency:
  group: epicentre-deploy
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy main to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: claude
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # set -e: see the other workflow file for why this matters -
            # a real incident (a build-breaking error that went uncaught
            # and restarted into a crash loop) is what prompted adding it.
            set -e
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            cd /home/claude/epicentre
            git fetch origin main
            git reset --hard origin/main
            set -a; source /home/claude/epicentre.env; set +a
            export DEPLOY_ENV=production
            export DATABASE_PATH=/home/claude/shared/epicentre.db
            export NEXT_PUBLIC_COMMIT_SHA=$(git rev-parse HEAD)
            npm ci
            npm run build
            node scripts/record-deploy.mjs production "$NEXT_PUBLIC_COMMIT_SHA"
            systemctl --user restart epicentre
            # Make the repo the source of truth for systemd user units:
            # copy them into place and reload, so a unit/timer added or
            # changed in deploy/systemd-user/ goes live on merge without SSH.
            # (Running units keep running across a daemon-reload; nothing is
            # restarted here except what this job already restarted above.)
            cp deploy/systemd-user/*.service deploy/systemd-user/*.timer ~/.config/systemd/user/
            systemctl --user daemon-reload
            # Idempotent: ensures the nightly backup timer is scheduled.
            # Until bootstrap (age key + backup repo) is done, the job it
            # runs logs "not configured" and exits 0 - see deploy/README.md.
            systemctl --user enable --now epicentre-backup.timer

      - name: Reset UAT to match main (so it goes grey)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: claude
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # A merge always creates a new commit SHA distinct from the
            # feature branch's tip, so UAT's last build (built from the
            # branch) can never equal prod's post-merge SHA on its own -
            # confirmed by testing, not theoretical. Rebuilding UAT from
            # the same main commit prod just deployed is what actually
            # makes the grey comparison in app/layout.tsx true. Until the
            # next feature branch pushes (which redeploys UAT and goes
            # blue again), UAT now simply mirrors main - correct, since
            # there's nothing left under review at that point.
            set -e
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            cd /home/claude/epicentre-preview
            git fetch origin main
            git reset --hard origin/main
            set -a; source /home/claude/epicentre-preview.env; set +a
            export DEPLOY_ENV=preview
            export DATABASE_PATH=/home/claude/shared/epicentre.db
            export NEXT_PUBLIC_COMMIT_SHA=$(git rev-parse HEAD)
            npm ci
            npm run build
            node scripts/record-deploy.mjs preview "$NEXT_PUBLIC_COMMIT_SHA"
            systemctl --user restart epicentre-preview
